<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Finder — The AI Tool Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171F;
    --paper:#F7F5F0;
    --accent:#5B5FEF;
    --accent-dim:#4347c4;
    --slate:#6B7280;
    --line:#DAD7CE;
    --amber:#FFB74D;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  .display{font-family:'Space Grotesk', sans-serif;}

  header{
    position:sticky; top:0; z-index:40;
    background:var(--ink);
    color:var(--paper);
    padding:16px 24px;
  }
  .header-inner{
    max-width:1120px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
  }
  .logo{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:1.25rem;
    letter-spacing:0.02em;
    display:flex; align-items:center; gap:8px;
  }
  .logo .dot{ width:8px; height:8px; background:var(--accent); border-radius:50%; }
  nav{ display:flex; gap:24px; font-size:0.9rem; }
  nav a{ text-decoration:none; opacity:0.8; transition:opacity .15s; }
  nav a:hover, nav a:focus-visible{ opacity:1; }
  nav a:focus-visible{ outline:2px solid var(--accent); outline-offset:4px; border-radius:2px; }

  .hero{
    max-width:1120px; margin:0 auto;
    padding:64px 24px 32px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    color:var(--accent-dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(2.1rem, 5vw, 3.4rem);
    line-height:1.05;
    margin:0 0 18px;
    max-width:14ch;
  }
  .hero p{
    color:var(--slate);
    font-size:1.05rem;
    max-width:46ch;
    margin:0 0 32px;
  }

  .search-wrap{
    display:flex; align-items:center; gap:0;
    background:var(--card);
